name: n8n-check
description: Test real n8n workflows with fixtures and HTTP mocks. Catch regressions with JSON, JUnit, and job summaries.
author: blucca
branding:
  icon: check-circle
  color: orange
inputs:
  workflow:
    description: Path to the n8n workflow export, relative to the checked-out repository.
    required: true
  case:
    description: Path to the n8n-check JSON case, relative to the checked-out repository.
    required: true
  out:
    description: Report directory inside the checked-out repository. Use a different path for each case.
    default: .n8n-check
  n8n-version:
    description: Exact n8n release from the official image registry. Choose your deployed or candidate version.
    default: '2.41.7'
outputs:
  report:
    description: Absolute host path to report.json, when the runner produced it.
    value: ${{ steps.check.outputs.report }}
  junit:
    description: Absolute host path to junit.xml, when the runner produced it.
    value: ${{ steps.check.outputs.junit }}
  exit-code:
    description: Runner exit code (0 passed, 1 regression, 2 setup error).
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Execute n8n fixture
      id: check
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        CHECK_WORKFLOW: ${{ inputs.workflow }}
        CHECK_CASE: ${{ inputs.case }}
        CHECK_OUT: ${{ inputs.out }}
        CHECK_N8N_VERSION: ${{ inputs.n8n-version }}
      run: node "$ACTION_ROOT/src/action.mjs"
