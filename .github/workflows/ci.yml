name: Real n8n regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fixed workflow passes
        id: fixed
        uses: ./
        with:
          workflow: examples/object-body/fixed.json
          case: examples/object-body/case.json
          out: temp/ci/fixed
      - name: Known JSON regression fails the Action
        id: broken
        continue-on-error: true
        uses: ./
        with:
          workflow: examples/object-body/broken.json
          case: examples/object-body/case.json
          out: temp/ci/broken
      - name: Missing fixture fails setup
        id: setup
        continue-on-error: true
        uses: ./
        with:
          workflow: examples/object-body/fixed.json
          case: missing-case.json
          out: temp/ci/setup
      - name: Verify actual success, regression and setup outcomes
        if: always()
        env:
          FIXED_OUTCOME: ${{ steps.fixed.outcome }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "$FIXED_OUTCOME" = success
          test "$BROKEN_OUTCOME" = failure
          test "$SETUP_OUTCOME" = failure
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const fixed = JSON.parse(readFileSync("temp/ci/fixed/report.json"));
            const broken = JSON.parse(readFileSync("temp/ci/broken/report.json"));
            assert.equal(fixed.exitCode, 0);
            assert.equal(broken.exitCode, 1);
            assert.equal(fixed.runnerVersion, "0.1.3");
            assert.equal(fixed.requests.length, 2);
            assert.equal(broken.requests.length, 0);
          '
      - name: Build runtime for comparison cases
        run: docker build -t n8n-check .
      - name: Compare direct, HTTP batching, and per-item loop retry
        run: |
          for mode in direct http-batching loop; do
            docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work" n8n-check \
              "examples/retry-isolation/$mode.json" "examples/retry-isolation/$mode-case.json" \
              --out "temp/ci/retry-$mode" || exit "$?"
          done
      - name: Successful execution still catches a silent filter regression
        run: |
          for mode in broken fixed; do
            set +e
            docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work" n8n-check \
              "examples/silent-filter/$mode.json" examples/silent-filter/case.json \
              --out "temp/ci/silent-$mode"
            code=$?
            set -e
            if [ "$mode" = broken ]; then test "$code" = 1; else test "$code" = 0; fi
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            for (const mode of ["broken", "fixed"]) {
              const report = JSON.parse(readFileSync(`temp/ci/silent-${mode}/report.json`));
              assert.equal(report.checks[0].passed, true);
              assert.equal(report.checks[1].actual.length, mode === "broken" ? 0 : 8);
              assert.equal(report.checks[1].passed, mode === "fixed");
              assert.equal(report.checks[2].passed, mode === "fixed");
              assert.equal(report.requests.length, 0);
            }
          '
      - name: PROPFIND preserves raw XML and detects a missing body
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work" n8n-check \
            examples/propfind-body/workflow.json examples/propfind-body/case.json \
            --out temp/ci/propfind
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work" n8n-check \
            examples/propfind-body/no-body-control.json examples/propfind-body/case.json \
            --out temp/ci/propfind-no-body
          code=$?
          set -e
          test "$code" = 1
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const report = JSON.parse(readFileSync("temp/ci/propfind-no-body/report.json"));
            assert.equal(report.checks[0].passed, true);
            assert.equal(report.checks.filter(c => !c.passed).length, 1);
            assert.deepEqual(report.checks.find(c => c.name.endsWith("request bodies")).actual, [null]);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-check-reports
          path: |
            temp/ci/**/report.json
            temp/ci/**/junit.xml
